name: PHP CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependências
        working-directory: ./02-phpunit-ci
        run: composer install --no-interaction --prefer-dist

      - name: Executar PHPUnit
        working-directory: ./02-phpunit-ci
        run: vendor/bin/phpunit tests